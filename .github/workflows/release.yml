name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The version stamp falls back to the VCS revision, so the build
          # needs real history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Nothing ships that has not passed the suite.
      - run: go vet ./...
      - run: bash tests/run.sh
      - run: go run . examples/core_tests.þ

      - name: Build
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Thunky is pure Go with no cgo, so every target cross-compiles from
          # here. -trimpath keeps the builder's absolute paths out of panic
          # traces; -X stamps the tag into the binary for --version.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="thunky-$TAG-$os-$arch"
            echo "building $name"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/$name/thunky$ext" .
            cp README.md LICENSE.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              (cd dist && tar czf "$name.tar.gz" "$name")
            fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      # Before publishing, so that a failure in the step below does not throw the
      # archives away with the runner. Recovering them cost a full rebuild the
      # first time this workflow ran.
      - name: Keep the archives regardless of what happens next
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.tag || github.ref_name }}
          path: dist/
          retention-days: 14

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -uo pipefail
          gh --version
          echo "publishing $TAG with assets:"
          ls -1 dist

          # A semver prerelease (v1.0.0-rc1) must not be marked as the latest
          # release; a plain v1.0.0 must.
          extra=()
          case "$TAG" in *-*) extra+=(--prerelease) ;; esac

          notes="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md) for what changed.

          Each archive holds a single \`thunky\` binary. Verify a download against \`SHA256SUMS\`.

          Or build from source: \`go install github.com/${{ github.repository }}@$TAG\`"

          # The first run of this workflow built all six targets and then died on
          # a transient HTTP 503 from the releases API. Retry — idempotently:
          # once the release object exists, switch to uploading onto it rather
          # than trying to create it again.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG exists; uploading assets"
              gh release upload "$TAG" dist/* --clobber && exit 0
            else
              gh release create "$TAG" dist/* \
                --title "Thunky $TAG" --notes "$notes" --verify-tag "${extra[@]}" && exit 0
            fi
            delay=$((attempt * 15))
            echo "publish attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
          echo "could not publish $TAG after 5 attempts"
          exit 1
