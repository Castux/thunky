name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # The site embeds the compiler, so a broken compiler must not be
      # published. test.yml covers the same ground on every push and PR; these
      # two steps are what stop a red suite from deploying anyway.
      - name: go vet
        run: go vet ./...
      - name: Golden suite
        run: bash tests/run.sh
      - name: Build site
        run: bash web/build.sh _site
      # core_tests.þ exits non-zero if any of its 471 assertions fails, and
      # smoke.mjs propagates that, so this is a real check on the wasm build
      # and not just proof that it starts.
      - name: Smoke-test the wasm build
        run: node web/smoke.mjs _site examples/core_tests.þ
      # And the pages around it, in a real browser: a top-level JavaScript error
      # would deploy a dead shell that every other check here would pass.
      - name: Smoke-test the pages
        run: node web/page-smoke.mjs _site
      - name: Check the playground's example catalogue
        # Static check only: every program, data file and module the picker
        # names must be in the site. Adding --run also executes the non-slow
        # ones, which takes about ten minutes.
        run: node web/check-examples.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
