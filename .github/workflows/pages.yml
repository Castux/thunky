name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build site
        run: bash web/build.sh _site
      - name: Smoke-test the wasm build
        run: node web/smoke.mjs _site examples/core_tests.þ
      - name: Check the playground's example catalogue
        # Static check only: every program, data file and module the picker
        # names must be in the site. Adding --run also executes the non-slow
        # ones, which takes about ten minutes.
        run: node web/check-examples.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
